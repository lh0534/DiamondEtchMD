[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "DiamondEtchMD"
version = "0.1.0"
description = "LAMMPS simulation setup and analysis for diamond surface radical/ion etching"
authors = [
    {name = "Louis E.S. Hoffenberg", email = "lhoff@princeton.edu"},
    {name = "Jack S. Draney",        email = "jackdraney@princeton.edu"},
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
diamond-etch-md = "diamond_etch_md.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["diamond_etch_md*"]

[tool.setuptools.package-data]
diamond_etch_md = ["lammps/templates/*.lmp", "lammps/templates/*.reax", "lammps/templates/*.txt", "lammps/templates/*.sh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slurm: submits a real SLURM job (requires cluster access; run with -m slurm)",
]
