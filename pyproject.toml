[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "DiamondEtchMD"
version = "0.1.0"
description = "LAMMPS simulation setup and analysis for diamond surface radical/ion etching"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
diamond-etch-md = "diamond_etch_md.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["diamond_etch_md*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slurm: submits a real SLURM job (requires cluster access; run with -m slurm)",
]
